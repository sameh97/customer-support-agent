services:

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # makes host.docker.internal work on Linux/WSL
    restart: unless-stopped